# These CI jobs are copied from the libdatadog-build 1.15.0 one-pipeline.yml template.
# The scripts ship in the libdatadog-build packaging image, so jobs extending these
# must use the packaging image tag published with that template version.

.validate_supported_configurations_v2_local_file:
  allow_failure: false
  rules:
    - when: on_success
  variables:
    LOCAL_JSON_PATH: ""
  before_script:
    - pip3 install requests jsonschema
  script:
    - /scripts/config-inversion/config-inversion-local-validation.py

.update_central_configurations_version_range_v2:
  allow_failure: false
  needs: []
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+\.[0-9]+$/'
      when: always
  variables:
    LOCAL_JSON_PATH: ""
    LANGUAGE_NAME: ""
    SEND_ALIASES: "false"
    CONFIG_REGISTRY_DRY_RUN: "false"
    CONFIG_REGISTRY_ALLOW_MASS_REMOVAL: "false"
    CONFIG_REGISTRY_ALLOW_PARTIAL_HISTORY: "false"
  before_script:
    - pip install requests pyyaml
    - export FP_API_KEY=$(aws ssm get-parameter --region us-east-1 --name ci.$CI_PROJECT_NAME.FP_API_KEY --with-decryption --query "Parameter.Value" --out text)
  script:
    - /scripts/config-inversion/config-inversion-update-supported-range.py
