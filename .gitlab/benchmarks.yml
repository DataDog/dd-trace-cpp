# The benchmarks CI image is built in-repo from .gitlab/benchmarks/container/
# by the `build-benchmark-ci-images` job of the shared template.
# @see https://github.com/DataDog/benchmarking-platform-tools/blob/main/images/templates/gitlab/build-ci-images.template.yml
include:
  - project: 'DataDog/benchmarking-platform-tools'
    file: 'images/templates/gitlab/build-ci-images.template.yml'

variables:
  # Consumed by the benchmark jobs below. To rebuild the image, run the manual
  # `build-benchmark-ci-images` job and repin to the tag it pushes
  # (dd-trace-cpp-<pipeline id>).
  BENCHMARKS_CI_IMAGE: registry.ddbuild.io/ci/benchmarking-platform:dd-trace-cpp-152753089

  # Consumed by the included build-ci-images template. The per-pipeline
  # suffix gives each build a unique tag.
  BASE_CI_IMAGE_SUFFIX: dd-trace-cpp-${CI_PIPELINE_ID}
  BASE_CI_IMAGE_CONTAINER_DIR: .gitlab/benchmarks/container

# The template puts this job in the ci-image stage; run it next to the
# benchmarks it builds for instead.
build-benchmark-ci-images:
  stage: benchmarks

benchmarks:
  stage: benchmarks
  when: on_success
  tags: ["runner:apm-k8s-tweaked-metal"]
  image: $BENCHMARKS_CI_IMAGE
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      interruptible: false
    - interruptible: true
  timeout: 15m
  script:
    - export ARTIFACTS_DIR="$(pwd)/reports" && (mkdir "${ARTIFACTS_DIR}" || :)
    - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.ddbuild.io/DataDog/".insteadOf "https://github.com/DataDog/"
    - export PATH="$PATH:${CI_PROJECT_DIR}/.gitlab/benchmarks/steps"
    - capture-hardware-software-info.sh
    - run-benchmarks.sh
    - analyze-results.sh
    - "upload-results-to-s3.sh || :"
    - "post-pr-comment.sh || :"
  artifacts:
    name: "reports"
    when: always
    paths:
      - reports/
    expire_in: 3 months
  variables:
    UPSTREAM_PROJECT_ID: $CI_PROJECT_ID # The ID of the current project. This ID is unique across all projects on the GitLab instance.
    UPSTREAM_PROJECT_NAME: $CI_PROJECT_NAME # "dd-trace-cpp"
    UPSTREAM_BRANCH: $CI_COMMIT_REF_NAME # The branch or tag name for which project is built.
    UPSTREAM_COMMIT_SHA: $CI_COMMIT_SHA # The commit revision the project is built for.
    # See https://datadoghq.atlassian.net/wiki/x/dAKLrgE for more details.
    FLAKY_BENCHMARKS_REGEX: ""

# This repository is using PR-level performance quality gates.
# Verify that the check-big-regressions CI job has passed. If any regression happened, merging this PR will be blocked.

# If bypassing is necessary, see https://datadoghq.atlassian.net/wiki/spaces/APMINT/pages/5158175217/Performance+quality+gates+-+User+Guide for more details.
check-big-regressions:
  stage: benchmarks-report
  needs: [ benchmarks ]
  when: on_success
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      interruptible: false
    - interruptible: true
  tags: ["arch:amd64"]
  image: $BENCHMARKS_CI_IMAGE
  script: |
    export ARTIFACTS_DIR="$(pwd)/reports/"
    if [[ -n "$CI_JOB_TOKEN" ]];
    then
      git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.ddbuild.io/DataDog/".insteadOf "https://github.com/DataDog/"
    fi

    bp-runner "$CI_PROJECT_DIR/.gitlab/benchmarks/bp-runner.fail-on-regression.yml" --debug
